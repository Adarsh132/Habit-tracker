<!DOCTYPE html>
<html>
    <body>
        <form action="/add_habit" method="post">
            <input type="text" name="name" placeholder="Habit Name" required>
            <input type="text" name="goal" placeholder="Goal" required>
            <input type="text" name="timing" placeholder="Timing" required>
            <input type="number" name="duration" placeholder="Duration (minutes)" required>
            <input type="text" name="emoji" placeholder="Emoji (optional)"> 
            <input type="text" name="why_reason" placeholder="Why are you starting this" required>
            <button type="submit">Add Habit</button> 
        </form>
    </body>
</html>
